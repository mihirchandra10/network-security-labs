# Lab FG-05: DoS policy and geo-IP blocking
# Goal: protect the WAN-facing web server from floods and scans, and drop traffic from
#       countries the business does not serve.
# Test: hping3 SYN flood from the attacker VM.
# Verify: diagnose ips anomaly list ; Log & Report > Anomaly

config firewall DoS-policy
    edit 1
        set name "WAN-DOS-PROTECT"
        set interface "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        config anomaly
            edit "tcp_syn_flood"
                set status enable
                set log enable
                set action block
                set threshold 2000
            next
            edit "tcp_port_scan"
                set status enable
                set log enable
                set action block
                set threshold 1000
            next
            edit "udp_flood"
                set status enable
                set log enable
                set action block
                set threshold 2000
            next
            edit "icmp_flood"
                set status enable
                set log enable
                set action block
                set threshold 250
            next
        end
    next
end

# Geo-IP address objects (example countries)
config firewall address
    edit "GEO-BLOCK-1"
        set type geography
        set country "KP"
    next
end
config firewall addrgrp
    edit "GEO-BLOCKED"
        set member "GEO-BLOCK-1"
    next
end

# Local-in policy: no admin access from blocked countries
config firewall local-in-policy
    edit 1
        set intf "wan1"
        set srcaddr "GEO-BLOCKED"
        set dstaddr "all"
        set service "ALL"
        set schedule "always"
        set action deny
    next
end

# Inbound policy: drop blocked countries before the VIP policy
config firewall policy
    edit 0
        set name "DENY-GEO-INBOUND"
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "GEO-BLOCKED"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
