# Lab FG-03: SD-WAN across two ISPs with performance SLAs
# Goal: send business apps over the best-quality link, balance general traffic,
#       and fail over automatically when a link degrades.
# Test: add latency/loss on wan1 in the ISP simulator and watch traffic move.
# Verify: diagnose sys sdwan health-check ; diagnose sys sdwan service ; diagnose sys sdwan member

config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set gateway 192.0.2.1
        next
        edit 2
            set interface "wan2"
            set gateway 203.0.113.1
        next
    end
    config health-check
        edit "SLA-INTERNET"
            set server "8.8.8.8" "1.1.1.1"
            set protocol ping
            set interval 500
            set failtime 3
            set recoverytime 5
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 150
                    set jitter-threshold 30
                    set packetloss-threshold 2
                next
            end
        next
    end
    config service
        edit 1
            set name "BUSINESS-APPS-BEST-QUALITY"
            set mode sla
            set internet-service enable
            set internet-service-app-ctrl 16354 41468
            config sla
                edit "SLA-INTERNET"
                    set id 1
                next
            end
            set priority-members 1 2
        next
    end
end
# App IDs above are examples (MS Teams, Zoom); look up current IDs on the unit.

config router static
    edit 1
        set distance 1
        set sdwan-zone "virtual-wan-link"
    next
end

config firewall policy
    edit 0
        set name "LAN-to-SDWAN"
        set srcintf "internal"
        set dstintf "virtual-wan-link"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set ips-sensor "IPS-STRICT"
        set logtraffic all
    next
end
