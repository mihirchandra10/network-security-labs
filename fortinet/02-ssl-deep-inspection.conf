# Lab FG-02: SSL deep inspection with exemptions
# Goal: decrypt HTTPS so AV/IPS can see threats inside TLS, while exempting banking/health
#       sites and blocking invalid certificates.
# Prerequisite: import or generate a CA certificate (LAB-CA) and deploy it to clients.
# Verify: open https://www.eicar.org test file -> blocked ; certificate in browser shows LAB-CA issuer

config firewall ssl-ssh-profile
    edit "DEEP-INSPECT"
        set comment "Full SSL inspection with exemptions"
        set server-cert-mode re-sign
        set caname "LAB-CA"
        config https
            set ports 443
            set status deep-inspection
            set unsupported-ssl-version block
            set expired-server-cert block
            set revoked-server-cert block
            set untrusted-server-cert block
            set cert-validation-timeout block
        end
        config ssl-exempt
            edit 1
                set fortiguard-category 31
            next
            edit 2
                set fortiguard-category 33
            next
            edit 3
                set type wildcard-fqdn
                set wildcard-fqdn "g-microsoft"
            next
        end
    next
end
# Exempt categories: 31 = Finance and Banking, 33 = Health and Wellness
