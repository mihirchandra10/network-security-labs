# Lab FG-01: UTM security profiles on FortiGate
# Goal: inspect user internet traffic with IPS, AV, web filter and application control.
# Test: EICAR download, browse a blocked category, run a BitTorrent client.
# Verify: Log & Report > Security Events ; diagnose ips anomaly list ; diagnose test application ipsmonitor 1

config ips sensor
    edit "IPS-STRICT"
        set comment "Block critical/high/medium, monitor the rest"
        config entries
            edit 1
                set severity critical high medium
                set status enable
                set action block
            next
            edit 2
                set severity low info
                set action pass
                set log-packet enable
            next
        end
    next
end

config antivirus profile
    edit "AV-STRICT"
        set feature-set proxy
        config http
            set av-scan block
        end
        config ftp
            set av-scan block
        end
        config smtp
            set av-scan block
        end
        set outbreak-prevention-archive-scan enable
    next
end

config webfilter profile
    edit "WF-CORP"
        config ftgd-wf
            unset options
            config filters
                edit 1
                    set category 26
                    set action block
                next
                edit 2
                    set category 61
                    set action block
                next
                edit 3
                    set category 86
                    set action block
                next
            end
        end
    next
end
# Category IDs: 26 = Malicious Websites, 61 = Phishing, 86 = Spam URLs

config application list
    edit "APP-CORP"
        config entries
            edit 1
                set category 2 6
                set action block
            next
        end
    next
end
# Category IDs: 2 = P2P, 6 = Proxy

config firewall policy
    edit 0
        set name "LAN-to-Internet"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set inspection-mode proxy
        set ssl-ssh-profile "DEEP-INSPECT"
        set av-profile "AV-STRICT"
        set webfilter-profile "WF-CORP"
        set ips-sensor "IPS-STRICT"
        set application-list "APP-CORP"
        set logtraffic all
    next
end
