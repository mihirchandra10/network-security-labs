# Lab FG-04: SSL VPN remote access with group-based policy
# Goal: remote staff connect with FortiClient (tunnel mode), authenticate against LDAP,
#       and reach only the internal subnets their group needs.
# Verify: get vpn ssl monitor ; diagnose debug application sslvpn -1

config user ldap
    edit "LDAP-AD"
        set server "10.10.0.10"
        set cnid "sAMAccountName"
        set dn "dc=lab,dc=local"
        set type regular
        set username "cn=fortigate-bind,ou=service,dc=lab,dc=local"
        set password <LDAP_BIND_PASSWORD>
    next
end

config user group
    edit "VPN-STAFF"
        set member "LDAP-AD"
        config match
            edit 1
                set server-name "LDAP-AD"
                set group-name "cn=vpn-staff,ou=groups,dc=lab,dc=local"
            next
        end
    next
end

config firewall address
    edit "SSLVPN-POOL"
        set type iprange
        set start-ip 10.212.134.100
        set end-ip 10.212.134.200
    next
end

config vpn ssl settings
    set servercert "LAB-VPN-CERT"
    set tunnel-ip-pools "SSLVPN-POOL"
    set source-interface "wan1"
    set source-address "all"
    set port 10443
    set default-portal "no-access"
    set ssl-min-proto-ver tls1-2
    config authentication-rule
        edit 1
            set groups "VPN-STAFF"
            set portal "full-access"
        next
    end
end

config vpn ssl web portal
    edit "full-access"
        set tunnel-mode enable
        set web-mode disable
        set split-tunneling enable
        set split-tunneling-routing-address "HQ-LAN"
        set ip-pools "SSLVPN-POOL"
    next
end

config firewall policy
    edit 0
        set name "SSLVPN-to-HQ"
        set srcintf "ssl.root"
        set dstintf "internal"
        set srcaddr "SSLVPN-POOL"
        set dstaddr "HQ-LAN"
        set groups "VPN-STAFF"
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ips-sensor "IPS-STRICT"
        set av-profile "AV-STRICT"
        set logtraffic all
    next
end
