/* Lab SRX-05: AppSecure (application identification, AppFW, AppTrack)
 * Goal: identify applications regardless of port, block risky ones (P2P, anonymizers),
 *       and record per-application usage with AppTrack.
 * Prerequisite (operational mode):
 *   request services application-identification download
 *   request services application-identification install
 * Verify: show services application-identification application-system-cache ;
 *         show security application-firewall rule-set all ; show services application-identification statistics applications
 */
security {
    application-firewall {
        rule-sets RS-BLOCK-RISKY {
            rule BLOCK-P2P-ANON {
                match {
                    dynamic-application [ junos:BITTORRENT junos:TOR junos:ULTRASURF ];
                }
                then { deny; }
            }
            default-rule { permit; }
        }
    }
    application-tracking {
        first-update;
        session-update-interval 5;
    }
    zones {
        security-zone trust { application-tracking; }
    }
    policies {
        from-zone trust to-zone untrust {
            policy USERS-ANY-APP {
                match { source-address NET-USERS; destination-address any; application any; }
                then {
                    permit { application-services { application-firewall { rule-set RS-BLOCK-RISKY; } utm-policy UTM-USERS; } }
                    log { session-close; }
                }
            }
        }
    }
}
/* Note: on newer Junos releases the recommended approach is unified policies
 * (match dynamic-application directly in the security policy); AppFW is shown here
 * because it is still widely deployed.
 */
