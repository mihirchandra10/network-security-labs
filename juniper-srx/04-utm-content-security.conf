/* Lab SRX-04: UTM / Content Security (antivirus, web filtering, anti-spam)
 * Goal: scan user web/mail traffic for malware, block malicious and unwanted URL
 *       categories with Enhanced Web Filtering, and filter spam.
 * Test: EICAR download ; browse a blocked category.
 * Verify: show security utm anti-virus statistics ; show security utm web-filtering statistics ;
 *         show security utm session
 */
security {
    utm {
        default-configuration {
            anti-virus {
                type sophos-engine;
                scan-options { uri-check; content-size-limit 20000; timeout 30; }
                fallback-options { default block; content-size block; engine-not-ready log-and-permit; timeout block; }
            }
            web-filtering {
                type juniper-enhanced;
                juniper-enhanced {
                    server { host rp.cloud.threatseeker.com; port 80; }
                    default log-and-permit;
                    fallback-settings { default log-and-permit; server-connectivity log-and-permit; timeout log-and-permit; }
                }
            }
            anti-spam {
                sbl { sbl-default-server; }
            }
        }
        feature-profile {
            web-filtering {
                juniper-enhanced {
                    profile EWF-CORP {
                        category {
                            Enhanced_Malicious_Web_Sites { action block; }
                            Enhanced_Phishing_and_Other_Frauds { action block; }
                            Enhanced_Spyware { action block; }
                            Enhanced_Gambling { action block; }
                            Enhanced_Adult_Material { action block; }
                        }
                        site-reputation-action {
                            very-safe permit;
                            moderately-safe log-and-permit;
                            fairly-safe log-and-permit;
                            harmful block;
                            suspicious block;
                        }
                        default log-and-permit;
                    }
                }
            }
        }
        utm-policy UTM-USERS {
            anti-virus { http-profile junos-sophos-av-defaults; ftp { upload-profile junos-sophos-av-defaults; download-profile junos-sophos-av-defaults; } }
            web-filtering { http-profile EWF-CORP; }
            anti-spam { smtp-profile junos-as-defaults; }
            traffic-options { sessions-per-client { limit 1000; over-limit log-and-permit; } }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy USERS-WEB {
                match { source-address NET-USERS; destination-address any; application [ junos-http junos-https junos-dns-udp ]; }
                then {
                    permit { application-services { utm-policy UTM-USERS; } }
                    log { session-close; }
                }
            }
        }
    }
}
