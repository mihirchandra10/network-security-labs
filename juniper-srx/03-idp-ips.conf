/* Lab SRX-03: IDP (intrusion prevention)
 * Goal: protect the DMZ web server with Juniper's recommended IDP template,
 *       dropping critical/major attacks and logging the rest.
 * Prerequisite (operational mode):
 *   request security idp security-package download
 *   request security idp security-package install
 *   request security idp security-package download policy-templates
 *   request security idp security-package install policy-templates
 * Verify: show security idp status ; show security idp attack table ; show security idp counters packet
 */
security {
    idp {
        idp-policy DMZ-IDP {
            rulebase-ips {
                rule DROP-CRITICAL {
                    match {
                        attacks { predefined-attack-groups "[Recommended]IP - Critical"; predefined-attack-groups "[Recommended]HTTP - Critical"; }
                    }
                    then {
                        action { drop-connection; }
                        notification { log-attacks; }
                        severity critical;
                    }
                }
                rule DROP-MAJOR {
                    match {
                        attacks { predefined-attack-groups "[Recommended]HTTP - Major"; }
                    }
                    then {
                        action { drop-connection; }
                        notification { log-attacks; }
                    }
                }
                rule LOG-REST {
                    match {
                        attacks { predefined-attack-groups "[Recommended]HTTP - Minor"; }
                    }
                    then {
                        action { no-action; }
                        notification { log-attacks; }
                    }
                }
            }
        }
        default-policy DMZ-IDP;
    }
    policies {
        from-zone untrust to-zone dmz {
            policy INET-TO-WEB {
                match { source-address any; destination-address SRV-WEB; application junos-https; }
                then {
                    permit { application-services { idp-policy DMZ-IDP; } }
                    log { session-close; }
                }
            }
        }
    }
}
