/* Lab SRX-01: Zones, security policies and NAT
 * Goal: trust/untrust/dmz zones, least-privilege policies, source NAT for users,
 *       destination NAT for the DMZ web server, static NAT for a mail relay.
 * Verify: show security flow session ; show security nat source summary ;
 *         show security match-policies from-zone trust to-zone untrust source-ip 10.10.0.50 destination-ip 8.8.8.8 protocol tcp source-port 50000 destination-port 443
 */
security {
    address-book {
        global {
            address NET-USERS 10.10.0.0/24;
            address SRV-WEB 172.16.10.10/32;
            address SRV-MAIL 172.16.10.20/32;
        }
    }
    zones {
        security-zone trust { interfaces { ge-0/0/1.0 { host-inbound-traffic { system-services { ping; ssh; dhcp; } } } } }
        security-zone untrust { screen UNTRUST-SCREEN; interfaces { ge-0/0/0.0; } }
        security-zone dmz { interfaces { ge-0/0/2.0 { host-inbound-traffic { system-services { ping; } } } } }
    }
    nat {
        source {
            rule-set TRUST-TO-UNTRUST {
                from zone trust;
                to zone untrust;
                rule USERS-SNAT { match { source-address 10.10.0.0/24; } then { source-nat { interface; } } }
            }
        }
        destination {
            pool POOL-WEB { address 172.16.10.10/32 port 443; }
            rule-set INBOUND-WEB {
                from zone untrust;
                rule WEB-DNAT {
                    match { destination-address 192.0.2.11/32; destination-port { 443; } }
                    then { destination-nat { pool { POOL-WEB; } } }
                }
            }
        }
        static {
            rule-set MAIL-STATIC {
                from zone untrust;
                rule MAIL { match { destination-address 192.0.2.12/32; } then { static-nat { prefix { 172.16.10.20/32; } } } }
            }
        }
        proxy-arp {
            interface ge-0/0/0.0 { address { 192.0.2.11/32; 192.0.2.12/32; } }
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy USERS-WEB {
                match { source-address NET-USERS; destination-address any; application [ junos-http junos-https junos-dns-udp ]; }
                then { permit; log { session-close; } }
            }
        }
        from-zone untrust to-zone dmz {
            policy INET-TO-WEB {
                match { source-address any; destination-address SRV-WEB; application junos-https; }
                then { permit; log { session-close; } }
            }
            policy INET-TO-MAIL {
                match { source-address any; destination-address SRV-MAIL; application junos-smtp; }
                then { permit; log { session-close; } }
            }
        }
        from-zone dmz to-zone trust {
            policy DMZ-NO-TRUST {
                match { source-address any; destination-address any; application any; }
                then { deny; log { session-init; } }
            }
        }
        default-policy { deny-all; }
    }
}
