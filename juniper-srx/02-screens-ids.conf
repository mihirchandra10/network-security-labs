/* Lab SRX-02: Screen options (flood, scan and malformed-packet protection)
 * Goal: protect the untrust zone from SYN/ICMP/UDP floods, port scans, IP spoofing
 *       and malformed packets before any policy lookup.
 * Test: hping3 --flood -S and nmap -sS from the attacker VM.
 * Verify: show security screen statistics zone untrust ; show security screen ids-option UNTRUST-SCREEN
 */
security {
    screen {
        ids-option UNTRUST-SCREEN {
            icmp {
                ping-death;
                flood threshold 1000;
                ip-sweep threshold 5000;
            }
            ip {
                source-route-option;
                tear-drop;
                spoofing;
                unknown-protocol;
            }
            tcp {
                syn-flood {
                    alarm-threshold 1024;
                    attack-threshold 2000;
                    source-threshold 1024;
                    destination-threshold 2048;
                    timeout 20;
                }
                land;
                syn-fin;
                tcp-no-flag;
                fin-no-ack;
                winnuke;
                port-scan threshold 5000;
            }
            udp {
                flood threshold 5000;
                port-scan threshold 5000;
            }
            limit-session {
                source-ip-based 500;
            }
        }
    }
    zones {
        security-zone untrust { screen UNTRUST-SCREEN; }
    }
}
